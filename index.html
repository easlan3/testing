<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click Me Eshqm 😂❤️🤭 </title>

  <!-- IMPORTANT FOR PHONES -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 360px; /* phone size */
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      color: #ff4d6d;
    }

    .buttons {
      position: relative;
      height: 140px;
    }

    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-120%);
    }

    #noBtn {
      background-color: #adb5bd;
      color: white;
      left: 50%;
      transform: translateX(20%);
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Extra small phones */
    @media (max-width: 400px) {
      h1 {
        font-size: 1.5rem;
      }

      button {
        font-size: 0.95rem;
        padding: 10px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Qalb𝓜 will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 🙄</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let yesSize = 1;

    // Floating hearts generator
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 2) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 4000);
    }, 500);

    noBtn.addEventListener("click", () => {
      // Make YES bigger
      yesSize += 0.25;
      yesBtn.style.fontSize = yesSize + "rem";
      yesBtn.style.padding =
        (12 + yesSize * 4) + "px " + (22 + yesSize * 8) + "px";

      // Move NO randomly but smoothly
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          background:linear-gradient(135deg,#ff4d6d,#ffb3c1);
          color:white;
          font-family:'Comic Sans MS', cursive;
          text-align:center;
          padding:20px;
        ">
          <h1 style="font-size:2.5rem;">
            𝓜aroy Zendagi𝓜 💕💞<br>
            I LOVE YOU ❤😂🤭
          </h1>
        </div>
      `;
    });
  </script>

</body>
</html>
